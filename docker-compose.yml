x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set, see .env.example}
      MYSQL_DATABASE: zhizao_xietong
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # 默认只绑回环地址供本机调试；生产环境可整条删除，容器网络内仍可互访
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}
    # 保留镜像自带 entrypoint：由它修正 /data 属主、setpriv 降权到 redis 用户并收紧 umask
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 默认只绑回环地址供本机调试；生产环境可整条删除，容器网络内仍可互访
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    logging: *default-logging

  # 一次性任务：用必填环境变量生成 Mosquitto 口令文件，明文不落仓库
  mqtt-init:
    image: eclipse-mosquitto:2
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME must be set, see .env.example}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set, see .env.example}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - rm -f /mosquitto/data/passwd && mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" && chown 1883:1883 /mosquitto/data/passwd && chmod 600 /mosquitto/data/passwd
    volumes:
      - mqtt-data:/mosquitto/data
    logging: *default-logging

  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    logging: *default-logging

  backend:
    build: ./zhizao-xietong
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhizao_xietong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set, see .env.example}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_SEED_DEMO_ENABLED: ${APP_SEED_DEMO_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME must be set, see .env.example}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set, see .env.example}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    logging: *default-logging

  frontend:
    build: ./zhizao-xietong-web
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  mqtt-data:
