x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# 常驻服务统一重启策略：进程异常退出或宿主机重启后自动拉起，人工 stop 后不再拉起
x-restart: &default-restart unless-stopped

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set, see .env.example}
      MYSQL_DATABASE: zhizao_xietong
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # 默认只绑回环地址供本机调试；生产环境可整条删除，容器网络内仍可互访
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    restart: *default-restart
    logging: *default-logging

  # 一次性任务：创建后端专用受限账号。每次 up 都执行，既覆盖全新实例，
  # 也覆盖已有数据卷的存量实例（库已存在但还没有该账号）。
  # 仅此步骤使用 root；应用运行与备份/恢复脚本的口令互不复用。
  mysql-init:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set, see .env.example}
      MYSQL_DATABASE: zhizao_xietong
      APP_DB_USERNAME: ${DB_USERNAME:-zhizao_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/mysql-init/create-app-user.sh"]
    volumes:
      - ./scripts/mysql-init-app-user.sh:/opt/mysql-init/create-app-user.sh:ro
    # 一次性任务不设重启策略，避免建号/授权被反复执行
    restart: "no"
    logging: *default-logging

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}
    # 保留镜像自带 entrypoint：由它修正 /data 属主、setpriv 降权到 redis 用户并收紧 umask
    entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 默认只绑回环地址供本机调试；生产环境可整条删除，容器网络内仍可互访
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    restart: *default-restart
    logging: *default-logging

  # 一次性任务：用必填环境变量生成 Mosquitto 口令文件与 ACL，明文不落仓库
  mqtt-init:
    # 需 2.1 及以上：该版本起 acl_file/password_file 改为认证插件，与 2.0 配置不兼容
    image: eclipse-mosquitto:2
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME must be set, see .env.example}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set, see .env.example}
      MQTT_ACL_TOPICS: ${MQTT_ACL_TOPICS:-factory/devices/+/status}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rm -f /mosquitto/data/passwd /mosquitto/data/acl &&
        mosquitto_passwd -b -c /mosquitto/data/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD" &&
        { printf 'user %s\n' "$$MQTT_USERNAME"; for t in $$MQTT_ACL_TOPICS; do printf 'topic readwrite %s\n' "$$t"; done; } > /mosquitto/data/acl &&
        chown 1883:1883 /mosquitto/data/passwd /mosquitto/data/acl &&
        chmod 600 /mosquitto/data/passwd /mosquitto/data/acl
    volumes:
      - mqtt-data:/mosquitto/data
    logging: *default-logging

  mqtt:
    # 同 mqtt-init：配置使用 2.1 起的认证插件语法，不要降级到 2.0.x
    image: eclipse-mosquitto:2
    ports:
      # 明文只绑回环地址：仅供本机调试，后端在容器网络内直接用 tcp://mqtt:1883
      - "127.0.0.1:${MQTT_PORT:-1883}:1883"
      # 设备入口：TLS，向内网发布
      - "${MQTT_TLS_PORT:-8883}:8883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
      # 证书由 scripts/gen-mqtt-certs.sh 生成，缺失时 mosquitto 启动失败（fail-fast）
      - ${MQTT_CERT_DIR:-./deploy/mqtt/certs}:/mosquitto/certs:ro
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    restart: *default-restart
    logging: *default-logging

  backend:
    build: ./zhizao-xietong
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhizao_xietong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      # 受限业务账号，仅 zhizao_xietong 库的 DML 与迁移所需 DDL；root 不进入应用运行期
      DB_USERNAME: ${DB_USERNAME:-zhizao_app}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, see .env.example}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set, see .env.example}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SSO_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-true}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_SEED_DEMO_ENABLED: ${APP_SEED_DEMO_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set, see .env.example}
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      MQTT_USERNAME: ${MQTT_USERNAME:?MQTT_USERNAME must be set, see .env.example}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?MQTT_PASSWORD must be set, see .env.example}
      # 设备上报 HMAC 鉴权：默认关闭以兼容尚未改造的存量设备
      # 开启时必须同时注入 DEVICE_CREDENTIAL_KEY，否则后端启动直接失败（fail-fast）
      DEVICE_AUTH_ENABLED: ${DEVICE_AUTH_ENABLED:-false}
      DEVICE_CREDENTIAL_KEY: ${DEVICE_CREDENTIAL_KEY:-}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      mysql-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: *default-restart
    logging: *default-logging

  frontend:
    build: ./zhizao-xietong-web
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    restart: *default-restart
    logging: *default-logging

volumes:
  mysql-data:
  redis-data:
  mqtt-data:
