services:
  mysql:
    image: mysql:8.0
    container_name: zhizao-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: zhizao_xietong
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: zhizao-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  mqtt:
    image: eclipse-mosquitto:2
    container_name: zhizao-mqtt
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./zhizao-xietong
    container_name: zhizao-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhizao_xietong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: tcp://mqtt:1883
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      mqtt:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build: ./zhizao-xietong-web
    container_name: zhizao-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  mysql-data:
  redis-data:
