server:
  port: 8080

spring:
  application:
    name: zhizao-xietong
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhizao_xietong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic: ${MQTT_TOPIC:factory/devices/+/status}
  client-id: ${MQTT_CLIENT_ID:zhizao-backend}
  qos: ${MQTT_QOS:1}

device:
  online-threshold-seconds: ${DEVICE_ONLINE_THRESHOLD_SECONDS:90}
  credential-key: ${DEVICE_CREDENTIAL_KEY:}
  simulation:
    enabled: ${DEVICE_SIMULATION_ENABLED:false}
  auth:
    enabled: ${DEVICE_AUTH_ENABLED:false}
    signature-tolerance-seconds: ${DEVICE_SIGNATURE_TOLERANCE_SECONDS:300}
  idempotency:
    ttl-seconds: ${DEVICE_IDEMPOTENCY_TTL_SECONDS:600}
    max-entries: ${DEVICE_IDEMPOTENCY_MAX_ENTRIES:10000}
  telemetry:
    retention-days: ${DEVICE_TELEMETRY_RETENTION_DAYS:90}

ai:
  # 默认关闭；关闭时三个 AI 端点返回 HTTP 503 + 业务码 503，其他功能不受影响
  enabled: ${AI_ENABLED:false}
  # fake 为离线确定性实现，CI 与本地演示无需网络与密钥；external 需手工配置模型地址与密钥
  provider: ${AI_PROVIDER:fake}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}
  model-url: ${AI_MODEL_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  max-rows: ${AI_MAX_ROWS:200}
  query-timeout-seconds: ${AI_QUERY_TIMEOUT_SECONDS:3}
  # 可选：AI 专属只读数据源；url 留空时回落主数据源，并以只读会话 + SQL 正则兜底
  datasource:
    url: ${AI_DATASOURCE_URL:}
    username: ${AI_DATASOURCE_USERNAME:}
    password: ${AI_DATASOURCE_PASSWORD:}

schedule:
  daily-hours: ${SCHEDULE_DAILY_HOURS:8}
  day-start-hour: ${SCHEDULE_DAY_START_HOUR:8}
  # 显式开启的估算工时，单位小时；0 表示关闭，标准工时缺失时直接拒绝排程
  estimate-fallback-hours: ${SCHEDULE_ESTIMATE_FALLBACK_HOURS:0}
