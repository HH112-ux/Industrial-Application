server:
  port: 8080

spring:
  application:
    name: zhizao-xietong
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhizao_xietong?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:zhizao_app}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    # 演示种子脚本（V2__seed.sql）已移至 classpath:db/seed，默认不加载；
    # 开启 app.seed.demo-enabled 时由 FlywaySeedConfig 追加该目录
    locations: classpath:db/migration
    # 演示种子关闭时，由 FlywaySeedConfig 追加 *:missing 以兼容「已执行过 V2__seed.sql
    # 但该脚本已移出 locations」的存量库；副作用是会同时掩盖历史迁移文件误删/漏拷，
    # 升级时需人工核对 flyway_schema_history 与 db/migration 文件清单。
    # 种子开启时 V2 在 locations 中，不再追加该模式，保持严格校验；
    # 已迁移完成的非演示库请勿开启演示开关，否则 V2 为低版本待执行状态会显式校验失败
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

jwt:
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION:86400000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 接口文档默认关闭，仅在明确需要的环境（如 dev）打开；与安全白名单共用 app.api-docs.enabled
springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled:false}
  swagger-ui:
    enabled: ${app.api-docs.enabled:false}

logging:
  # 默认（生产）只输出 INFO 及以上，SQL 语句与参数不落业务日志
  level:
    root: INFO
    com.zhizao: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"

app:
  seed:
    # 演示种子数据开关：默认关闭，空库启动不写入演示设备/物料/工艺/计划；
    # 仅本地或演示环境显式设为 true，已上线的存量库请保持 false
    demo-enabled: ${APP_SEED_DEMO_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}
  # 接口文档开关：默认关闭，生产不暴露 Swagger/OpenAPI
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  http:
    # 可信反向代理的固定 IP（逗号分隔）；留空表示不信任 X-Forwarded-For，直接使用 TCP 对端地址
    trusted-proxies: ${TRUSTED_PROXIES:}
  login:
    # IP 维度限流阈值（次/分钟）；账号维度固定 10 次/分钟。设为 0 关闭 IP 维度
    ip-max-attempts: ${LOGIN_IP_MAX_ATTEMPTS:30}
  sso:
    # 总开关：默认关闭；关闭时登录行为与今天完全一致，接口返回明确拒绝
    enabled: ${SSO_ENABLED:false}
    # 浏览器标识 Cookie 是否带 Secure；HTTPS 部署必须为 true，仅本机 http 调试可关闭
    cookie-secure: ${SSO_COOKIE_SECURE:true}
    # 本地为主后默认关闭 JIT：未开通的企微用户不自动建号，需管理员先开通
    jit-enabled: ${SSO_JIT_ENABLED:false}
    provider: ${SSO_PROVIDER:WEIXIN_WORK}
    # 以下四项开启时必填，缺失则启动失败；真实值只从环境变量注入，禁止写入仓库
    wecom:
      corp-id: ${SSO_WECOM_CORP_ID:}
      agent-id: ${SSO_WECOM_AGENT_ID:}
      secret: ${SSO_WECOM_SECRET:}
      redirect-uri: ${SSO_WECOM_REDIRECT_URI:}
    # 假身份提供方仅用于 dev/test，且必须显式开启；生产环境不装配该 Bean
    fake-provider-enabled: ${SSO_FAKE_PROVIDER_ENABLED:false}

mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  username: ${MQTT_USERNAME:}
  password: ${MQTT_PASSWORD:}
  topic: ${MQTT_TOPIC:factory/devices/+/status}
  client-id: ${MQTT_CLIENT_ID:zhizao-backend}
  qos: ${MQTT_QOS:1}
  # 与 mqtt-init 生成的 ACL 同源（空白分隔的主题模式）；启动时用于比对订阅主题是否被覆盖
  acl-topics: ${MQTT_ACL_TOPICS:}

device:
  online-threshold-seconds: ${DEVICE_ONLINE_THRESHOLD_SECONDS:90}
  credential-key: ${DEVICE_CREDENTIAL_KEY:}
  alarm:
    # 离线扫描周期，毫秒
    offline-scan-ms: ${DEVICE_ALARM_OFFLINE_SCAN_MS:60000}
    notify:
      # 企业微信应用消息默认关闭；未配置 corpId/agentId/secret 时静默跳过
      wecom:
        enabled: ${DEVICE_ALARM_WECOM_ENABLED:false}
        corp-id: ${DEVICE_ALARM_WECOM_CORP_ID:}
        agent-id: ${DEVICE_ALARM_WECOM_AGENT_ID:}
        secret: ${DEVICE_ALARM_WECOM_SECRET:}
        # 通知为旁路：超时与队列容量可调，外部调用失败只记日志与审计
        connect-timeout-ms: ${DEVICE_ALARM_WECOM_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${DEVICE_ALARM_WECOM_READ_TIMEOUT_MS:3000}
        queue-capacity: ${DEVICE_ALARM_WECOM_QUEUE_CAPACITY:200}
  simulation:
    enabled: ${DEVICE_SIMULATION_ENABLED:false}
  auth:
    enabled: ${DEVICE_AUTH_ENABLED:false}
    signature-tolerance-seconds: ${DEVICE_SIGNATURE_TOLERANCE_SECONDS:300}
  idempotency:
    ttl-seconds: ${DEVICE_IDEMPOTENCY_TTL_SECONDS:600}
    max-entries: ${DEVICE_IDEMPOTENCY_MAX_ENTRIES:10000}
  telemetry:
    retention-days: ${DEVICE_TELEMETRY_RETENTION_DAYS:90}

ai:
  # 默认关闭；关闭时三个 AI 端点返回 HTTP 503 + 业务码 503，其他功能不受影响
  enabled: ${AI_ENABLED:false}
  # fake 为离线确定性实现，CI 与本地演示无需网络与密钥；external 需手工配置模型地址与密钥
  provider: ${AI_PROVIDER:fake}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:5}
  model-url: ${AI_MODEL_URL:}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
  max-rows: ${AI_MAX_ROWS:200}
  query-timeout-seconds: ${AI_QUERY_TIMEOUT_SECONDS:3}
  # 可选：AI 专属只读数据源；url 留空时回落主数据源，并以只读会话 + SQL 正则兜底
  datasource:
    url: ${AI_DATASOURCE_URL:}
    username: ${AI_DATASOURCE_USERNAME:}
    password: ${AI_DATASOURCE_PASSWORD:}

schedule:
  daily-hours: ${SCHEDULE_DAILY_HOURS:8}
  day-start-hour: ${SCHEDULE_DAY_START_HOUR:8}
  # 显式开启的估算工时，单位小时；0 表示关闭，标准工时缺失时直接拒绝排程
  estimate-fallback-hours: ${SCHEDULE_ESTIMATE_FALLBACK_HOURS:0}

---
# 仅 dev profile：打开 MyBatis SQL 与控制台输出，便于本机调试。
# 默认（不激活 dev）不加载本段，SQL 与参数不会写入生产日志。
spring:
  config:
    activate:
      on-profile: dev

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# dev 本机调试：放开接口文档（仍可用 API_DOCS_ENABLED=false 显式关闭）；
# 本机走 http，SSO 浏览器标识 Cookie 允许不带 Secure
app:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  sso:
    cookie-secure: ${SSO_COOKIE_SECURE:false}

logging:
  level:
    com.zhizao: DEBUG
