name: CI

on:
  push:
  pull_request:

jobs:
  commitlint:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install commitlint
        run: npm ci
      - name: Validate commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}"
          else
            FROM="${{ github.event.before }}"
            if [ "$FROM" = "0000000000000000000000000000000000000000" ]; then
              FROM="HEAD~1"
            fi
          fi
          npx --no -- commitlint --from "$FROM" --to HEAD --verbose

  # Secret scan scope is intentionally limited to the commits introduced by this
  # push or pull request. Scanning full history would fail the build on legacy
  # commits that cannot be fixed without rewriting history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo install -m 755 gitleaks /usr/local/bin/gitleaks
      - name: Scan changed commits
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            RANGE="origin/${{ github.base_ref }}..HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..${{ github.event.after }}"
            fi
          fi
          echo "Scanning range: $RANGE"
          gitleaks git --no-banner --redact --log-opts="$RANGE"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhizao-xietong
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhizao-xietong-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: zhizao-xietong-web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
