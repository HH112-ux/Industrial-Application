# 认证与授权：mosquitto 2.1 起 acl_file / password_file 改为插件形式，
# 路径通过 plugin_opt_* 传入（镜像需为 2.1 及以上，见 compose 注释）
allow_anonymous false
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/data/passwd
plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/data/acl

# 明文监听：仅用于容器网络内后端连接与本机调试，compose 只把该端口发布到 127.0.0.1
listener 1883 0.0.0.0

# 设备入口：TLS，向内网发布。证书由 scripts/gen-mqtt-certs.sh 生成，不提交仓库
listener 8883 0.0.0.0
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
